<!DOCTYPE html>

<html>

<head>
<title>Payment Success</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(
        135deg,
        #f8fafc,
        #e2e8f0,
        #cbd5e1
    );
}

.container{
    width:700px;
    margin:60px auto;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0px 4px 15px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:green;
    margin-bottom:30px;
}

.details{
    font-size:22px;
    line-height:2;
}

.buttons{
    text-align:center;
    margin-top:30px;
}

.history-btn{
    background:#0d6efd;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
    margin-right:10px;
}

.dashboard-btn{
    background:#28a745;
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;
}

.history-btn:hover{
    background:#0b5ed7;
}

.dashboard-btn:hover{
    background:#218838;
}

</style>

</head>

<body>

<div class="container">


<h1>✅ Payment Recorded Successfully</h1>

<div class="details">

    <p><b>Receipt Number:</b> {{ receipt_no }}</p>

    <p><b>Roll Number:</b> {{ roll_no }}</p>

    <p><b>Amount Paid:</b> ₹{{ amount }}</p>

    <p><b>Payment Mode:</b> {{ payment_mode }}</p>

    <p><b>Payment Date:</b> {{ payment_date | indian_date }}</p>

</div>

<div class="buttons">

    <a href="/payments" class="history-btn">
        📜 View Payment History
    </a>

    <a href="/" class="dashboard-btn">
        🏠 Dashboard
    </a>

</div>

</div>

</body>

</html>
