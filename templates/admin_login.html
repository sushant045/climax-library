<!DOCTYPE html>

<html>

<head>
    <title>Admin Login</title>


<style>

    body{
        font-family: Arial, sans-serif;
        background: linear-gradient(
            135deg,
            #f5f7fa,
            #dfe9f3
        );
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        margin:0;
    }

    .login-box{
        width:400px;
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0px 4px 15px rgba(0,0,0,0.2);
    }

    h1{
        text-align:center;
        color:#003366;
        margin-bottom:25px;
    }

    input{
        width:100%;
        padding:12px;
        margin-top:10px;
        margin-bottom:20px;
        border:1px solid #ccc;
        border-radius:8px;
    }

    button{
        width:100%;
        padding:12px;
        background:#003366;
        color:white;
        border:none;
        border-radius:8px;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
    }

    button:hover{
        background:#002244;
    }

</style>

</head>

<body>

<div class="login-box">


<h1>🔐 Admin Login</h1>

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <button type="submit">
        Login
    </button>

</form>


</div>

</body>

</html>
